# Type check, unit tests, production build and browser tests (real WebRTC between Chromium instances through the
# development server's local relay) on every push and pull request; the tests over simulated networks in a second
# job, in parallel.
name: CI

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (development server)
        run: npm run e2e -- --project chromium
      - name: Browser tests (production build)
        run: |
          npx vite preview --port 4179 --strictPort &
          for i in $(seq 30); do curl -sf http://localhost:4179/ > /dev/null && break; sleep 1; done
          E2E_URL=http://localhost:4179/ npm run e2e -- --project chromium
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # MIDI, the microphone and the backing track over simulated networks (server/netsim.ts): delay up to 200 ms each
  # way, jitter, loss; timing measured by ear. In parallel with the job above.
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser tests over simulated networks
        run: npm run e2e -- --project network
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-network
          path: test-results/
          retention-days: 7
