<!doctype html>
<!-- Camera stand-ins for screenshots (tools/screenshots.ts): rendered to video files and fed to Chromium's fake camera. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#000}
.scene{position:absolute;inset:0;display:none}
body[data-scene=keys] #keys, body[data-scene=person] #person, body[data-scene=score] #score{display:block}
/* overhead keyboard under a warm lamp */
#keys{background:radial-gradient(900px 600px at 30% 20%,#6b4a2a,#2a1a10 55%,#120b07)}
#keys .board{position:absolute;left:-80px;right:-80px;top:250px;height:520px;transform:perspective(1100px) rotateX(38deg) rotateZ(-6deg);transform-origin:50% 0;}
#keys .rail{position:absolute;left:0;right:0;top:-70px;height:80px;background:linear-gradient(#1b120c,#0d0806);border-radius:6px 6px 0 0;box-shadow:0 -20px 40px rgba(0,0,0,.5)}
#keys .w{position:absolute;top:0;height:440px;background:linear-gradient(90deg,#d9d1c4,#fbf7f0 18%,#f3ede3 80%,#cfc6b8);border-radius:0 0 8px 8px;box-shadow:inset 0 -10px 18px rgba(0,0,0,.18)}
#keys .b{position:absolute;top:0;height:270px;background:linear-gradient(90deg,#050404,#2a2624 45%,#0b0a09);border-radius:0 0 6px 6px;box-shadow:0 12px 14px rgba(0,0,0,.55),inset 0 -8px 8px rgba(255,255,255,.06);z-index:2}
#keys .hand{position:absolute;z-index:3;border-radius:46% 46% 40% 40%;background:radial-gradient(60% 80% at 50% 20%,#e7b391,#c98a66 70%,#a76c4f);filter:blur(1.2px);box-shadow:0 30px 40px rgba(0,0,0,.35)}
#keys .finger{position:absolute;z-index:3;width:34px;border-radius:17px;background:linear-gradient(90deg,#c58767,#e8b796 45%,#c88b6a);filter:blur(.8px)}
#keys .light{position:absolute;inset:0;background:radial-gradient(700px 420px at 35% 40%,rgba(255,200,130,.28),transparent 70%),linear-gradient(transparent 60%,rgba(0,0,0,.55));mix-blend-mode:normal}
/* a person in a warm room, out of focus background */
#person{background:linear-gradient(120deg,#3b2b22,#1d1613 60%,#120e0c)}
#person .bokeh{position:absolute;border-radius:50%;filter:blur(18px);opacity:.75}
#person .shelf{position:absolute;right:70px;top:120px;width:300px;height:360px;filter:blur(7px);opacity:.55;background:repeating-linear-gradient(0deg,#2a1d15 0 8px,transparent 8px 120px),repeating-linear-gradient(90deg,#7a3d2a 0 18px,#c09a5a 18px 30px,#3d5a6b 30px 44px,#8a6a3a 44px 60px,#5a2d26 60px 74px)}
#person .lamp{position:absolute;left:120px;top:90px;width:260px;height:260px;border-radius:50%;background:radial-gradient(#ffd9a0,#e89a4a 40%,transparent 70%);filter:blur(20px);opacity:.9}
#person .body{position:absolute;left:390px;top:300px;width:520px;height:520px;border-radius:48% 48% 0 0;background:radial-gradient(80% 60% at 40% 20%,#3a3f52,#22252f 60%,#14161c)}
#person .neck{position:absolute;left:600px;top:290px;width:96px;height:90px;background:linear-gradient(90deg,#9e6b51,#c99073,#a06d52);border-radius:0 0 40px 40px}
#person .head{position:absolute;left:545px;top:105px;width:200px;height:250px;border-radius:48% 48% 46% 46%;background:radial-gradient(70% 70% at 38% 35%,#e9b796,#c88b6b 55%,#9a634a)}
#person .hair{position:absolute;left:530px;top:84px;width:232px;height:170px;border-radius:50% 50% 30% 30%;background:radial-gradient(80% 90% at 50% 15%,#4a3426,#2b1d16 70%)}
#person .rim{position:absolute;inset:0;background:radial-gradient(500px 420px at 25% 30%,rgba(255,190,120,.22),transparent 70%),radial-gradient(1000px 600px at 50% 120%,rgba(0,0,0,.5),transparent)}
/* the teacher's camera: the score on the music stand, under a warm lamp */
#score{background:radial-gradient(800px 600px at 70% 10%,#5a3b22,#24170f 60%,#0e0907)}
#score .page{position:absolute;left:250px;top:40px;width:800px;height:600px;background:linear-gradient(170deg,#fbf6ea,#efe5d1 70%,#e2d4ba);transform:perspective(1400px) rotateX(14deg) rotateZ(-2.5deg);transform-origin:50% 100%;box-shadow:0 40px 80px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.08);border-radius:3px}
#score .page svg{position:absolute;inset:0}
#score .ledge{position:absolute;left:180px;right:180px;top:640px;height:44px;background:linear-gradient(#2b1d14,#140d09);border-radius:6px;box-shadow:0 20px 40px rgba(0,0,0,.6);transform:rotateZ(-2.5deg)}
#score .glow{position:absolute;inset:0;background:radial-gradient(600px 500px at 60% 30%,rgba(255,210,150,.18),transparent 70%),linear-gradient(transparent 70%,rgba(0,0,0,.45))}
</style></head>
<body data-scene="keys">
<div id="keys" class="scene"><div class="board"><div class="rail"></div></div><div class="light"></div></div>
<div id="person" class="scene">
  <div class="lamp"></div>
  <div class="bokeh" style="left:80px;top:420px;width:120px;height:120px;background:#ffb86b"></div>
  <div class="bokeh" style="left:1040px;top:80px;width:90px;height:90px;background:#ffd59a"></div>
  <div class="bokeh" style="left:960px;top:520px;width:140px;height:140px;background:#a3602f"></div>
  <div class="shelf"></div>
  <div class="body"></div><div class="neck"></div><div class="head"></div><div class="hair"></div>
  <div class="rim"></div>
</div>
<div id="score" class="scene"><div class="page"><svg id="music" viewBox="0 0 800 760"></svg></div><div class="ledge"></div><div class="glow"></div></div>
<script>
const p = new URLSearchParams(location.search);
document.body.dataset.scene = p.get('scene') || 'keys';
// keyboard: 3 octaves seen from above
const board = document.querySelector('#keys .board');
const W = 1440 / 21;
const black = [1, 2, 4, 5, 6];
for (let i = 0; i < 21; i++) {
  const w = document.createElement('div'); w.className = 'w';
  w.style.left = (i * W + 1) + 'px'; w.style.width = (W - 3) + 'px'; board.appendChild(w);
  if (black.includes(i % 7)) { const b = document.createElement('div'); b.className = 'b'; b.style.left = (i * W - W * 0.3) + 'px'; b.style.width = (W * 0.6) + 'px'; board.appendChild(b); }
}
// two hands resting on the keys
const hand = (x, y, flip) => {
  const h = document.createElement('div'); h.className = 'hand';
  Object.assign(h.style, { left: x + 'px', top: y + 'px', width: '220px', height: '170px' }); board.appendChild(h);
  [[-10, 60, 150], [35, 0, 180], [85, -20, 195], [135, -5, 185], [180, 30, 150]].forEach(([dx, dy, len], k) => {
    const f = document.createElement('div'); f.className = 'finger';
    const fx = flip ? x + 200 - dx - 34 : x + dx;
    Object.assign(f.style, { left: fx + 'px', top: (y + dy - len + 90) + 'px', height: len + 'px' });
    board.appendChild(f);
  });
};
hand(330, 250, false); hand(820, 230, true);
// the score: a title, five systems of treble and bass staves, a phrase of notes and a teacher's pencil mark
const svg = document.getElementById('music');
const NS = 'http://www.w3.org/2000/svg';
const el = (n, a, t) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (t) e.textContent = t; svg.appendChild(e); return e; };
el('text', { x: 400, y: 62, 'text-anchor': 'middle', 'font-family': 'DejaVu Serif, serif', 'font-size': 30, fill: '#2a2420' }, 'Prélude');
el('text', { x: 400, y: 88, 'text-anchor': 'middle', 'font-family': 'DejaVu Serif, serif', 'font-style': 'italic', 'font-size': 15, fill: '#5a5048' }, 'Andante cantabile');
let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let sys = 0; sys < 3; sys++) {
  for (let st = 0; st < 2; st++) {
    const top = 130 + sys * 155 + st * 62;
    for (let l = 0; l < 5; l++) el('line', { x1: 60, x2: 750, y1: top + l * 9, y2: top + l * 9, stroke: '#3a332d', 'stroke-width': 1.1 });
    el('text', { x: 64, y: top + (st ? 30 : 38), 'font-family': 'DejaVu Sans, serif', 'font-size': st ? 34 : 54, fill: '#2a2420' }, st ? '\u{1D122}' : '\u{1D11E}');
    for (let bar = 1; bar <= 4; bar++) el('line', { x1: 60 + bar * 172.5, x2: 60 + bar * 172.5, y1: top, y2: top + 36, stroke: '#3a332d', 'stroke-width': 1.2 });
    let pitch = st ? 4 : 2;
    for (let n = 0; n < (st ? 8 : 16); n++) {
      const x = 118 + n * (st ? 82 : 41) + (n % (st ? 2 : 4) === 0 ? 6 : 0);
      pitch = Math.max(-2, Math.min(9, pitch + Math.round(rnd() * 4 - 2)));
      const y = top + 36 - pitch * 4.5;
      el('ellipse', { cx: x, cy: y, rx: 5.6, ry: 4.2, fill: '#1f1a16', transform: `rotate(-20 ${x} ${y})` });
      const up = pitch < 4;
      el('line', { x1: up ? x + 5.2 : x - 5.2, x2: up ? x + 5.2 : x - 5.2, y1: y, y2: up ? y - 30 : y + 30, stroke: '#1f1a16', 'stroke-width': 1.3 });
      if (pitch < 0) el('line', { x1: x - 9, x2: x + 9, y1: top + 45, y2: top + 45, stroke: '#3a332d', 'stroke-width': 1.1 });
    }
  }
}
// pencil: a slur and "legato!" from the teacher
el('path', { d: 'M150 300 Q 330 250 520 296', fill: 'none', stroke: '#b23a2e', 'stroke-width': 2.4, 'stroke-linecap': 'round', opacity: .85 });
el('text', { x: 560, y: 286, 'font-family': 'DejaVu Serif, serif', 'font-style': 'italic', 'font-size': 22, fill: '#b23a2e', opacity: .9, transform: 'rotate(-6 560 286)' }, 'legato!');
</script>
</body></html>
